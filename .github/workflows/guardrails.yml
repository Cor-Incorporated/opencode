# Fork-only CI for the one fork-owned package. Upstream's workflows keep running for everything else;
# this job is what gates packages/guardrails on the fork `dev` (2.x re-platform, Cor-Incorporated/opencode#342).
name: guardrails

on:
  pull_request:
    paths:
      - "packages/guardrails/**"
      - "scripts/sync-model-whitelist.py"
      # The tests decode upstream's bundled model catalog and pin core sources, so an upstream sync that only
      # touches packages/core must run them too.
      - "packages/core/src/**"
      - ".github/workflows/**"
  push:
    branches: [dev]
    paths:
      - "packages/guardrails/**"
      - "scripts/sync-model-whitelist.py"
      # The tests decode upstream's bundled model catalog and pin core sources, so an upstream sync that only
      # touches packages/core must run them too.
      - "packages/core/src/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Native config regression tests import the real core normalizer and its workspace dependencies.
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: bun test profile/src profile/plugins
        working-directory: packages/guardrails
        run: bun test profile/src profile/plugins
      - name: model whitelist ↔ catalog snapshot
        run: python3 scripts/sync-model-whitelist.py
