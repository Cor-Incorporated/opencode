name: close-prs

on:

# 2026-09-01 (fork): schedule トリガを外した。workflow_dispatch は残してある。
# これらは upstream (anomalyco/opencode) の「外部コントリビュータ取り締まり」自動化で、
# 見知らぬ他人が OSS に PR を投げてくる前提の設計。本 fork は保守者 1 名の私有リポで、
# upstream 追随などの正当な保守 PR を自動 close してしまう。
# 実際 2026-09-01 に PR #315（upstream 116 commit 取り込み、CI 12/12 green）が
# compliance-close により 2 時間で close された。
# 検査そのもの（pr-standards.yml のコメント / ラベル / status check）は残す。
# 手動で回したいときは workflow_dispatch から実行できる。
# 理由: 1 か月以上前かつ肯定リアクション 2 未満の PR を close する。本 fork ではその閾値に到達しない
#  schedule:
#    - cron: "0 22 * * *" # Daily at 10:00 PM UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Log matching PRs without closing them"
        type: boolean
        default: true
      max-close:
        description: "Maximum matching PRs to close"
        type: string
        required: false
        default: "50"

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Close old PRs without enough positive reactions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          max_close="${{ inputs['max-close'] }}"
          if [ -z "$max_close" ]; then
            max_close="50"
          fi

          args=("--threshold" "2" "--age-months" "1" "--sleep-ms" "20000" "--max-close" "$max_close")

          if [ "${{ github.event_name }}" = "schedule" ]; then
            args+=("--execute")
          elif [ "${{ inputs['dry-run'] }}" = "false" ]; then
            args+=("--execute")
          fi

          bun script/github/close-prs.ts "${args[@]}"
