name: check

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, beta]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ case(github.ref == 'refs/heads/dev', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ github.repository == 'anomalyco/opencode' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Fork PRs need the shared upstream ancestor; keep the upstream job's original shallow checkout.
          fetch-depth: ${{ github.repository != 'anomalyco/opencode' && github.event_name == 'pull_request' && '0' || '2' }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Lint
        run: bun run lint

      # Local `bun run check` uses `bun check`; CI keeps the official TypeScript compiler as the source of truth.
      - name: Typecheck (TypeScript 7.1)
        run: bun run typecheck:tsc

      # Match lint:changed's local upstream/dev merge base. Imported upstream files retain upstream ownership;
      # every fork-owned GUI change, including an untracked file, still runs the whole-file warning gate.
      - name: Resolve fork lint baseline
        id: lint_base
        if: github.event_name == 'pull_request' && github.repository != 'anomalyco/opencode'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/anomalyco/opencode.git dev
          base="$(git merge-base HEAD FETCH_HEAD)"
          test -n "$base"
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"

      # Every GUI package file (app, desktop, gui-plugins, the plugin package's GUI SDK, ui, session-ui) a pull request adds or edits must be free of
      # oxlint problems, warn-level rules (anti-slop) included. Other packages are not affected.
      - name: Lint changed files
        if: github.event_name == 'pull_request'
        env:
          LINT_BASE: ${{ github.repository == 'anomalyco/opencode' && 'HEAD^1' || steps.lint_base.outputs.base }}
        run: |
          test -n "$LINT_BASE"
          bun run lint:changed "$LINT_BASE"
