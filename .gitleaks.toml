# Repository gitleaks config, read by the org workflow Cor-Incorporated/.github/.github/workflows/gitleaks.yml
# (`gitleaks git ... --config .gitleaks.toml` when this file exists).
#
# The default ruleset stays in force (useDefault). The allowlists below exist only because the fork's `dev` was
# re-based onto upstream anomalyco/opencode `dev` (Cor-Incorporated/opencode#342 / #343): the PR scan range then
# contains ~4800 upstream commits, and 30 default-rule hits in them are not real secrets: keybind strings, i18n
# message keys, a generated SDK, and test fixtures (redaction tests use fake keys on purpose). Scan of 2026-10-19
# (gitleaks 8.30.1, `origin/dev..b7e7730ed3`): 30 findings, 0 in fork-authored commits.
#
# Each entry is scoped to ONE upstream commit AND the exact files it touched (condition = "AND"), so the same files
# changed by any other commit (later upstream syncs, every fork commit) are still scanned.
# Do not widen an entry to a path-only or rule-only allowlist; add a new commit-scoped entry per upstream sync instead.

[extend]
useDefault = true

[[allowlists]]
description = "upstream cc8886c8bb73: jwt in 1 file(s), not real secrets (#343)"
condition = "AND"
commits = ["cc8886c8bb738a0c7e7075a57af6dedd6c4f6508"]
paths = [
  '''^packages/ai/test/fixtures/recordings/runway\-video/generates\-a\-video\.json$''',
]

